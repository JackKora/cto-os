[project]
name = "cto-os"
version = "0.1.0"
description = "CTO OS — logic side. Skill definitions, MCP server, deterministic scripts."
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "mcp",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
# Exact versions pinned in uv.lock; committed for reproducibility.

[tool.pytest.ini_options]
pythonpath = ["mcp-server"]
testpaths = ["tests"]
